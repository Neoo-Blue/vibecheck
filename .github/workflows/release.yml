name: Release

# Publishes the APK as a GitHub release, vibecheck-<version>.apk, with the notes from that
# version's section of CHANGELOG.md. Three ways in:
#   - a push to master whose versionName (app/build.gradle.kts) has no release yet: bump the
#     version, merge, and the release appears. Pushes of an already released version do nothing;
#   - pushing a tag like v6.6.0 (it has to match versionName);
#   - running it by hand with a tag. Running it for an existing release replaces the APK,
#     e.g. after adding the signing key below.
# Every push to master also brings the notes of earlier releases in line with their changelog
# entries, when those were edited after the release.
#
# Signing: every release is signed with the one key in app/signing/release.p12, so each version
# installs over the one before. The key file is encrypted; its password is the repository secret
# RELEASE_KEY_PASSWORD. Without the secret nothing is published: an APK with a one-off key could
# not be installed over any earlier release. The published APK's certificate is checked against
# the key's fingerprint below before it goes out.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v6.6.0 (created on the chosen branch if it does not exist)
        required: true

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide what to publish
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "$EVENT" = workflow_dispatch ]; then TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = tag ]; then TAG="$REF_NAME"
          else TAG="v$VERSION"
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # A push to master only releases a version that has no release yet.
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ] && gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.plan.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.plan.outputs.skip != 'true'

      - name: Signing key password
        if: steps.plan.outputs.skip != 'true'
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::The repository secret RELEASE_KEY_PASSWORD is missing (Settings > Secrets and variables > Actions). Without it the APK would get a one-off key and could not be installed over earlier releases, so nothing is published."
            exit 1
          fi

      - name: Unit tests and release APK
        if: steps.plan.outputs.skip != 'true'
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Check the APK carries the release key
        if: steps.plan.outputs.skip != 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          if ! grep -qi "SHA-256 digest: $RELEASE_CERT_SHA256" certs.txt; then
            echo "::error::The APK is not signed with the release key (expected certificate SHA-256 $RELEASE_CERT_SHA256)."
            exit 1
          fi
        env:
          RELEASE_CERT_SHA256: d364f1fbf423b44f5970c5b67ceede64ae8407a22bb1a8c23fedcd1b29f1b017

      - name: Publish
        if: steps.plan.outputs.skip != 'true'
        run: |
          APK="vibecheck-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)

          # This version's section of the changelog, without its heading.
          awk -v v="$VERSION" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > notes.md

          EN="Signed with the Vibecheck release key: it installs over the version on your phone as an update, and later versions install over it."
          ZH="使用 Vibecheck 固定签名：直接覆盖安装手机上的版本即可升级，以后的版本也能直接覆盖它。"
          {
            echo
            echo "---"
            echo
            echo "**Install.** Download \`$APK\`, install it, add a key, and enable **Vibecheck** under Accessibility (Android 13+: App info → ⋮ → Allow restricted settings first). $EN"
            echo
            echo "**安装。** 下载 \`$APK\` 安装，填 Key，在无障碍设置里开启「Vibecheck 读空气」（Android 13+ 先在应用信息 → ⋮ → 允许受限设置）。$ZH"
            echo
            echo "SHA-256: \`$SHA\`"
          } >> notes.md

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Vibecheck $VERSION" --notes-file notes.md
          fi

      - name: Earlier release notes follow the changelog
        # A changelog entry edited after its release (a correction, or wording taken out) is carried
        # over to that release's notes. Only the part above the install notes is replaced; the
        # install notes and the checksum stay as published. Notes laid out otherwise (6.5.1 and
        # older) are left alone, and nothing here can hold up a release.
        if: github.event_name == 'push' && github.ref_type == 'branch'
        continue-on-error: true
        run: |
          for TAG in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            gh release view "$TAG" --json body --jq .body > body.md || continue
            # Published notes: the section, a blank line, "---", a blank line, then **Install.**
            SEP=$(grep -n '^---$' body.md | head -1 | cut -d: -f1)
            [ -n "$SEP" ] || continue
            sed -n "$((SEP + 2))p" body.md | grep -q '^\*\*Install\.\*\*' || continue
            awk -v v="${TAG#v}" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > section.md
            [ -s section.md ] || continue
            { cat section.md; echo; } > want.md
            head -n $((SEP - 1)) body.md | cmp -s - want.md && continue
            { cat want.md; tail -n +"$SEP" body.md; } > notes.md
            gh release edit "$TAG" --notes-file notes.md && echo "The notes of $TAG follow the changelog again."
          done

      - name: Earlier releases go (once, with 6.9.4)
        # Asked for once: with 6.9.4 out, every earlier release goes, with its tag, and so do tags
        # left without a release. Only on the run that publishes 6.9.4; taken out again after.
        if: steps.plan.outputs.skip != 'true' && env.VERSION == '6.9.4'
        run: |
          for OLD in $(gh release list --limit 500 --json tagName --jq '.[].tagName'); do
            [ "$OLD" = "$TAG" ] && continue
            gh release delete "$OLD" --yes --cleanup-tag && echo "Took down $OLD."
          done
          for OLD in $(git ls-remote --tags origin | sed -n 's|.*refs/tags/\([^^]*\)$|\1|p' | sort -u); do
            [ "$OLD" = "$TAG" ] && continue
            git push origin --delete "refs/tags/$OLD" && echo "Deleted the tag $OLD."
          done
